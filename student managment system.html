<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>

<h2>Smart Student Management System</h2>

<button onclick="displayStudents()">Display Students</button>
<button onclick="averageMarks()">Average Marks</button>
<button onclick="topStudents()">Top Students</button>
<button onclick="departmentCount()">Department Count</button>
<button onclick="vowelCount()">Vowel Count</button>

<pre id="output"></pre>

<script>
// Student Data
let students = [
    { id: 1, name: "Rahul", marks: 80, department: "CSE", attendance: 90 },
    { id: 2, name: "Anita", marks: 70, department: "ECE", attendance: 85 },
    { id: 3, name: "Kiran", marks: 90, department: "CSE", attendance: 95 },
    { id: 4, name: "Sneha", marks: 60, department: "EEE", attendance: 80 }
];

// 1. Display Student Details
function displayStudents() {
    let result = "";
    for (let i = 0; i < students.length; i++) {
        for (let key in students[i]) {
            result += key + ": " + students[i][key] + "\n";
        }
        result += "-----------------\n";
    }
    document.getElementById("output").textContent = result;
}

// 2. Calculate Average Marks
function averageMarks() {
    let sum = 0;
    for (let i = 0; i < students.length; i++) {
        sum += students[i].marks;
    }
    let avg = sum / students.length;
    document.getElementById("output").textContent = "Average Marks: " + avg;
}

// 3. Filter Top Students (>75)
function topStudents() {
    let result = "Top Students:\n";
    for (let i = 0; i < students.length; i++) {
        if (students[i].marks > 75) {
            result += students[i].name + "\n";
        }
    }
    document.getElementById("output").textContent = result;
}

// 4. Department-wise Count
function departmentCount() {
    let deptCount = {};

    for (let i = 0; i < students.length; i++) {
        let dept = students[i].department;

        if (deptCount[dept]) {
            deptCount[dept]++;
        } else {
            deptCount[dept] = 1;
        }
    }

    let result = "Department Count:\n";
    for (let dept in deptCount) {
        result += dept + ": " + deptCount[dept] + "\n";
    }

    document.getElementById("output").textContent = result;
}

// 5. Count Vowels in Student Names
function vowelCount() {
    let vowels = "aeiouAEIOU";
    let count = 0;

    for (let i = 0; i < students.length; i++) {
        let name = students[i].name;

        for (let j = 0; j < name.length; j++) {
            if (vowels.includes(name[j])) {
                count++;
            }
        }
    }

    document.getElementById("output").textContent = "Total Vowels in Names: " + count;
}
</script>

</body>
</html>
